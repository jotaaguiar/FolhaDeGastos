name: Deploy Backend (Azure App Service)

on:
  push:
    branches:
      - main
    paths:
      - 'fluxo/server/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'fluxo/server/package-lock.json'

      - name: Install dependencies
        working-directory: fluxo/server
        run: npm ci

      - name: Build
        working-directory: fluxo/server
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            fluxo/server/dist
            fluxo/server/package.json
            fluxo/server/package-lock.json
            fluxo/server/prisma
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: fluxo/server

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: fluxo-api
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: fluxo/server
